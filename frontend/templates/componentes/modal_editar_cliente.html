<!-- Modal Editar Cliente -->
<div id="modal-editar"
    class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div
        class="bg-white w-full max-w-md bento-card p-0 overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-200">
        <div class="border-b border-border p-6 flex justify-between items-center bg-zinc-50">
            <h2 class="font-headline-md text-primary tracking-tight">Editar Cliente</h2>
            <button onclick="cerrarModal()" class="text-on-surface-variant hover:text-primary transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="form-editar" class="p-8 flex flex-col gap-6" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">DNI / CUIL</label>
                <input id="edit-dni" class="input-swiss bg-zinc-50" type="text" disabled />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-1">
                    <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">Nombre</label>
                    <input id="edit-nombre" name="nombre" class="input-swiss" type="text" required />
                </div>
                <div class="flex flex-col gap-1">
                    <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">Apellido</label>
                    <input id="edit-apellido" name="apellido" class="input-swiss" type="text" required />
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">Teléfono</label>
                <input id="edit-telefono" name="telefono" class="input-swiss" type="tel" required />
            </div>
            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">Email</label>
                <input id="edit-email" name="email" class="input-swiss" type="email" />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-1">
                    <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">Domicilio</label>
                    <input id="edit-domicilio" name="domicilio" class="input-swiss" type="text" required />
                </div>
                <div class="flex flex-col gap-1">
                    <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1.5">Localidad</label>
                    <input id="edit-localidad" name="localidad" class="input-swiss" type="text" required />
                </div>
            </div>
            <div class="flex gap-4 mt-4">
                <button type="button" onclick="cerrarModal()"
                    class="btn-swiss btn-outline flex-1 justify-center">Cancelar</button>
                <button type="submit" class="btn-swiss btn-primary flex-1 justify-center">Actualizar</button>
            </div>
        </form>
    </div>
</div>
