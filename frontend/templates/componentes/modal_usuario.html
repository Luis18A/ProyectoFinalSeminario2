<!-- Modal Registrar / Editar Usuario -->
<div id="modal-usuario"
    class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-in fade-in duration-200">
    <div
        class="bg-white w-full max-w-md border border-zinc-200 p-0 overflow-hidden shadow-2xl flex flex-col animate-in slide-in-from-bottom duration-300">
        <div class="border-b border-[#1A1A1A]/38 p-6 flex justify-between items-center bg-zinc-50">
            <h2 id="modal-title" class="text-sm font-bold uppercase tracking-wider text-primary flex items-center gap-2">
                <span id="modal-title-icon" class="material-symbols-outlined text-primary text-[18px]">person_add</span>
                <span id="modal-title-text">Registrar Nuevo Usuario</span>
            </h2>
            <button onclick="cerrarModalUsuario()" class="text-on-surface-variant hover:text-primary transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="form-usuario" class="p-8 flex flex-col gap-5" method="POST" action="/usuarios">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1">Usuario (Único) *</label>
                <input id="input-username" name="username" required class="input-swiss" placeholder="ej. jdoe88" type="text" />
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1">Contraseña *</label>
                <input id="input-password" name="password" required class="input-swiss" placeholder="••••••••" type="password" />
                <p id="password-help" class="text-[10px] text-zinc-400 mt-1 hidden">Dejar en blanco para mantener la actual</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col gap-1">
                    <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1">Nombre *</label>
                    <input id="input-nombre" name="nombre" required class="input-swiss" placeholder="Juan" type="text" />
                </div>
                <div class="flex flex-col gap-1">
                    <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1">Apellido *</label>
                    <input id="input-apellido" name="apellido" required class="input-swiss" placeholder="Pérez" type="text" />
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1">Rol Asignado *</label>
                <select id="select-rol" name="rol_id" required class="input-swiss appearance-none bg-transparent">
                    <option value="">Seleccionar rol...</option>
                    {% for rol in roles %}
                    <option value="{{ rol.id }}">{{ rol.descripcion }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-center justify-between h-[38px] pb-1.5 px-2 border-b border-zinc-200">
                <span class="font-label-bold text-zinc-500 uppercase text-[10px]">Estado Activo</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input id="check-activo" name="activo" checked="" class="sr-only peer" type="checkbox" value="True" />
                    <div
                        class="w-11 h-6 bg-zinc-200 peer-focus:outline-none ring-0 rounded-none peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary">
                    </div>
                </label>
            </div>

            <div class="flex gap-4 mt-4">
                <button type="button" onclick="cerrarModalUsuario()"
                    class="btn-swiss btn-outline flex-grow justify-center">Cancelar</button>
                <button id="btn-submit" type="submit" class="btn-swiss btn-primary flex-grow justify-center flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">save</span>
                    <span id="btn-submit-text">Crear Usuario</span>
                </button>
            </div>
        </form>
    </div>
</div>
