<!-- Modal Registrar Nuevo Tipo de Dispositivo (Emergente) -->
<div id="modal-nuevo-tipo"
    class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 animate-in fade-in duration-200">
    <div
        class="bg-white w-full max-w-sm border border-zinc-200 p-0 overflow-hidden shadow-2xl flex flex-col animate-in slide-in-from-bottom duration-300">
        <div class="border-b border-[#1A1A1A]/38 p-6 flex justify-between items-center bg-zinc-50">
            <h2 class="text-sm font-bold uppercase tracking-wider text-primary flex items-center gap-2">
                <span class="material-symbols-outlined text-primary text-[18px]">add_circle</span>
                Nuevo Tipo de Equipo
            </h2>
            <button type="button" onclick="cerrarModalNuevoTipo()" class="text-on-surface-variant hover:text-primary transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="form-nuevo-tipo" class="p-8 flex flex-col gap-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flex flex-col gap-1">
                <label class="font-label-bold text-zinc-500 uppercase text-[10px] block mb-1">Dispositivo *</label>
                <input id="input-nuevo-tipo" name="descripcion" class="input-swiss" placeholder="Ej. Notebook, PC, Impresora" type="text" required />
            </div>
            <div class="flex gap-4 mt-4">
                <button type="button" onclick="cerrarModalNuevoTipo()"
                    class="btn-swiss btn-outline flex-1 justify-center">Cancelar</button>
                <button type="submit" class="btn-swiss btn-primary flex-1 justify-center flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">save</span>
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
